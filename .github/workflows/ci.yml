name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck aplikasi
        run: npm run typecheck
      - name: Typecheck Pages Functions
        run: npx -p typescript tsc -p functions/tsconfig.json
      - name: Build (tanpa API key; snapshot klub dilewati otomatis)
        run: npm run build
