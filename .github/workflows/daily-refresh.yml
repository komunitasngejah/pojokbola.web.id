# Refresh harian: memicu build ulang di Cloudflare Pages agar snapshot klub
# dan news sitemap tetap segar. Simpan URL Deploy Hook sebagai secret CF_DEPLOY_HOOK.
name: Daily refresh

on:
  schedule:
    - cron: '0 20 * * *' # 03:00 WIB setiap hari
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deploy hook
        env:
          CF_DEPLOY_HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          if [ -z "$CF_DEPLOY_HOOK" ]; then
            echo "Secret CF_DEPLOY_HOOK belum diisi."; exit 1
          fi
          curl -fsS -X POST "$CF_DEPLOY_HOOK"
